.aurora-bg {

.aurora-bg::before {
    content: "";

@keyframes auroraMove {
    0%, 100% { transform: translate(0, 0) rotate(0deg) scale(1); }
    33% { transform: translate(5%, -5%) rotate(120deg) scale(1.1); }
    66% { transform: translate(-5%, 5%) rotate(240deg) scale(0.95); }

    top: -100px; left: -100px;

.liquid-blob:nth-child(3) {

        0 0 40px rgba(93, 45, 232, 0.4),
        0 0 60px rgba(0, 212, 255, 0.2),
        0 8px 25px rgba(0, 0, 0, 0.7),

.match-row-single::before {
    content: "";
    position: absolute;
    top: 0;
    left: -80%;
    width: 60%;
    height: 100%;
    background: linear-gradient(
        100deg,
        transparent 0%,
        rgba(255, 215, 100, 0.12) 30%,
        rgba(255, 240, 180, 0.45) 50%,
        rgba(255, 215, 100, 0.12) 70%,
        transparent 100%

    transform: skewX(-20deg);
    animation: matchShine 4.5s ease-in-out infinite;
    pointer-events: none;
    z-index: 1;

@keyframes matchShine {
    0%   { left: -80%; opacity: 0; }
    10%  { opacity: 1; }
    45%  { left: 130%; opacity: 1; }
    55%  { left: 130%; opacity: 0; }
    100% { left: 130%; opacity: 0; }
}

        0 0 30px rgba(255, 204, 51, 0.7),
        0 0 60px rgba(0, 212, 255, 0.6),
